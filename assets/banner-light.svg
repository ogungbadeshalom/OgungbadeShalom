<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6f9fd"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="45%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0d9488"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0 L0 0 0 36" fill="none" stroke="#0d9488" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30" result="b"/>
      <feComposite in="b" operator="over"/>
    </filter>
  </defs>
  <rect width="840" height="300" fill="url(#bg)"/>
  <rect width="840" height="300" fill="url(#grid)"/>
  <ellipse cx="640" cy="60" rx="140" ry="140" fill="#0d9488" opacity="0.08" filter="url(#glow)">
    <animate attributeName="cx" values="640;684;616;640" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="150" cy="250" rx="150" ry="150" fill="#0369a1" opacity="0.07" filter="url(#glow)">
    <animate attributeName="cx" values="150;118;172;150" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <text x="420" y="120" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="52" font-weight="800" fill="url(#title)" letter-spacing="1">OGUNGBADE SHALOM</text>
  <text x="420" y="168" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" fill="#5b6b83" letter-spacing="3">
    <tspan>FOUNDER · BUILDER · AUTOMATION ENGINEER</tspan>
  </text>
  <rect x="700" y="156" width="12" height="22" fill="#0d9488" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="300" y="196" width="240" height="2" fill="#0d9488" rx="1">
    <animate attributeName="width" values="180;260;180" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="330;290;330" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="420" y="248" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="17" fill="#76879e" letter-spacing="5">BUILD · SHIP · AUTOMATE · REPEAT</text>
</svg>