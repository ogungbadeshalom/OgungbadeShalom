<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300" role="img" aria-label="Ogungbade Shalom, light and dark themes">
  <defs>
    <clipPath id="lt"><polygon points="0,0 502,0 470,300 0,300"/></clipPath>
    <clipPath id="dk"><polygon points="502,0 840,0 840,300 470,300"/></clipPath>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#8b5cf6" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0.25"/>
    </linearGradient>
    <pattern id="lgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#0d9488" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <pattern id="dgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0 L0 0 0 30" fill="none" stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="lname" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="dspectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#ff00d9"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- LIGHT HALF -->
  <g clip-path="url(#lt)">
    <rect width="840" height="300" fill="#f6f9fd"/>
    <rect width="840" height="300" fill="url(#lgrid)"/>
    <text x="58" y="42" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#8c959f" letter-spacing="3">PREFERS-COLOR-SCHEME: LIGHT</text>
    <circle cx="452" cy="52" r="10" fill="#f59e0b"/>
    <g stroke="#f59e0b" stroke-width="2" stroke-linecap="round">
      <line x1="452" y1="32" x2="452" y2="38"/><line x1="452" y1="66" x2="452" y2="72"/>
      <line x1="432" y1="52" x2="438" y2="52"/><line x1="466" y1="52" x2="472" y2="52"/>
    </g>
    <text x="250" y="158" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="800" fill="url(#lname)" letter-spacing="-1">OGUNGBADE SHALOM</text>
    <text x="250" y="192" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10.5" fill="#5b6b83" letter-spacing="3">FOUNDER · BUILDER · AUTOMATION</text>
    <text x="250" y="252" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#0d9488" letter-spacing="4">BUILD · SHIP · AUTOMATE · REPEAT</text>
  </g>

  <!-- DARK HALF -->
  <g clip-path="url(#dk)">
    <rect width="840" height="300" fill="#0a0420"/>
    <rect width="840" height="300" fill="url(#dgrid)"/>
    <text x="782" y="42" text-anchor="end" font-family="'JetBrains Mono','Courier New',monospace" font-size="10" fill="#6e7681" letter-spacing="3">PREFERS-COLOR-SCHEME: DARK</text>
    <path d="M760 40 A16 16 0 1 0 760 64 A12 12 0 1 1 760 40 Z" fill="#a78bfa"/>
    <circle cx="796" cy="38" r="1.5" fill="#a78bfa"/>
    <circle cx="784" cy="62" r="1.2" fill="#a78bfa"/>
    <path fill="none" stroke="url(#dspectrum)" stroke-width="2.5" opacity="0.7">
      <animate attributeName="d" values="M508 270 C 620 262 700 250 840 210 ; M508 270 C 620 280 700 228 840 210 ; M508 270 C 620 262 700 250 840 210" dur="9s" repeatCount="indefinite"/>
    </path>
    <path fill="none" stroke="url(#dspectrum)" stroke-width="3" filter="url(#glow)" opacity="0.9">
      <animate attributeName="d" values="M508 292 C 620 286 700 272 840 238 ; M508 292 C 620 305 700 252 840 238 ; M508 292 C 620 286 700 272 840 238" dur="6s" repeatCount="indefinite"/>
    </path>
    <text x="660" y="158" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-1">OGUNGBADE SHALOM</text>
    <text x="660" y="158" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',system-ui,sans-serif" font-size="34" font-weight="800" fill="url(#dspectrum)" letter-spacing="-1" opacity="0.7" filter="url(#glow)">OGUNGBADE SHALOM</text>
    <text x="660" y="192" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="10.5" fill="#00d9ff" letter-spacing="3">FOUNDER · BUILDER · AUTOMATION</text>
    <text x="660" y="252" text-anchor="middle" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" fill="#a78bfa" letter-spacing="4">BUILD · SHIP · AUTOMATE · REPEAT</text>
  </g>

  <!-- SEAM -->
  <line x1="502" y1="0" x2="470" y2="300" stroke="url(#seam)" stroke-width="2"/>
</svg>