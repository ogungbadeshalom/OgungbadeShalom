  <text x="454" y="66" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="800" fill="#38bdf8" letter-spacing="1">AUTOMATES REVENUE</text>
  <text x="454" y="92" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="#8aa0c0">
